<!-- NOTE: *very* similar to biography-stamp.component.html, with one difference in the height of
a card image at 150px instead of 240px (tucked into styling) and a big one in the support for a list view rather than card view. -->
<a tabindex="0" role="link" [ngClass]="{'card': cardView(),'list':!cardView()}"
  [routerLink]="['/storiesForBio', {ID: bio.document.accession}]"
  routerLinkActive="active"
  [thdaScrollToMe]="isSelected(bio)">
  @if (cardView()) {
    <div class="card_img-backdrop">
      <img class="card__img" src="{{myMediaBase}}biography/image/{{bio.document.biographyID}}" alt="" />
    </div>
  }
  @if (cardView()) {
    <div class="card__info-overlay">
      <h3 class="card__contents">{{bio.document.preferredName}}</h3>
    </div>
  }
  @if (!cardView()) {
    <div class="card_img-label">
      <h3 class="list__name">{{bio.document.preferredName}}</h3>
      <p class="list__contents"><span class="bold">Born:</span> {{bio.document.birthDate | date}}</p>
      @if (bio.highlights) {
        <div>
          @for (description of bio.highlights.descriptionShort; track $index) {
            <span class="list__contents" [innerHTML]="description"></span>
          }
        </div>
      }
    </div>
  }
</a>
